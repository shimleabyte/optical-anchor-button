<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Optical Anchor — centered eye-first button</title>
<desc id="desc">An oversized naturalistic amber and copper eye centered in a burnt-orange enamel button housing framed by graphite hardware.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eee8df"/><stop offset="1" stop-color="#e3dbd0"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48352a"/><stop offset=".52" stop-color="#211a16"/><stop offset="1" stop-color="#120f0d"/></linearGradient>
  <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c35a31"/><stop offset=".42" stop-color="#b34d26"/><stop offset=".8" stop-color="#963e20"/><stop offset="1" stop-color="#78321d"/></linearGradient>
  <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8ed"/><stop offset=".36" stop-color="#f7ebdb"/><stop offset=".72" stop-color="#e9d1b9"/><stop offset="1" stop-color="#c59d83"/></linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1c7a2"/><stop offset=".48" stop-color="#a95e43"/><stop offset="1" stop-color="#613322"/></linearGradient>
  <radialGradient id="iris" cx="36%" cy="27%" r="78%"><stop stop-color="#f8d897"/><stop offset=".24" stop-color="#dca15a"/><stop offset=".52" stop-color="#a95d30"/><stop offset=".78" stop-color="#69351f"/><stop offset="1" stop-color="#2d1a14"/></radialGradient>
  <radialGradient id="pupil" cx="32%" cy="22%" r="85%"><stop stop-color="#33251e"/><stop offset=".65" stop-color="#100e0d"/><stop offset="1" stop-color="#050505"/></radialGradient>
  <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff0d6"/></linearGradient>
  <clipPath id="irisClip"><circle cx="80" cy="52" r="27.5"/></clipPath>
</defs>
<rect width="1400" height="820" fill="url(#paper)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="92" y="84" font-size="14" font-weight="700" letter-spacing="3" fill="#71675d">OPTICAL ANCHOR / DESIGN EXPERIMENT 002</text>
  <path d="M92 112H1308" stroke="#bcb2a6"/>
  <text x="92" y="240" font-size="76" font-weight="650" letter-spacing="-3.5" fill="#191816">The eye is</text>
  <text x="92" y="323" font-size="76" font-weight="650" letter-spacing="-3.5" fill="#a74925">the interface.</text>
  <text x="96" y="371" font-size="18" fill="#635a51">No CTA. No ornament competing for attention. Just a responsive focal point.</text>
  <rect x="92" y="424" width="1216" height="316" rx="2" fill="#191816"/>
  <path d="M126 470H1274" stroke="#39312b"/>
  <text x="126" y="456" font-size="10" font-weight="700" letter-spacing="2.5" fill="#a99b8c">LIVE OBJECT / EYE-FIRST HOUSING</text>
  <text x="1274" y="456" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2" fill="#a99b8c">SLEEP → TRACK → TIRED</text>
