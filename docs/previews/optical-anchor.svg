  <text x="126" y="624" font-size="10" font-weight="700" letter-spacing="2.1" fill="#b9a99a">BURNT ORANGE ENAMEL</text>
  <text x="126" y="644" font-size="12" fill="#e4d7ca">Warm sclera · copper iris · controlled highlights</text>
  <text x="1274" y="624" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2" fill="#b9a99a">CENTERED / OVERSIZED</text>
  <text x="1274" y="644" text-anchor="end" font-size="12" fill="#e4d7ca">Page-wide gaze after wake-up</text>
  <text x="92" y="781" font-size="11" letter-spacing="1.8" fill="#81766a">CUSTOM SVG / NATIVE BUTTON / NO THIRD-PARTY ICONS OR FONTS</text>
  <text x="1308" y="781" text-anchor="end" font-size="11" fill="#81766a">DESIGN BRANCH</text>
